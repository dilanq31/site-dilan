<!doctype HTML>
<html>


<head>
<meta charset="utf-8">
<link rel="stylesheet" href="indescss.css">
<title>Tableau</title>

</head>


<body>



<style>
    table,th,td{
        border:1px solid black;




    }
</style>


    <table>
        <caption>Ces aliments sont-ils sucrés ou salés ?</caption>
        <tr>
          <th scope="col">Aliment</th>
          <th scope="col">Sucré ou Salé </th>
        </tr>
        <tr>
          <th scope="row">Beignet</th>
          <td>Sucré</td>
        </tr>
        <tr>
          <th scope="row">Pizza</th>
          <td>Salé</td>
        </tr>
        <tr>
          <th scope="row">Chocolat</th>
          <td>Sucré</td>
        </tr>
        <tr>
          <th scope="row">Tarte aux pommes</th>
          <td>Sucré</td>
        </tr>
      </table>

</body>




</html>
